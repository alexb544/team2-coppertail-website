{% extends "accounts/base.html" %}
{% block content %}
<style>
    .reset-done-shell {
        padding: 48px 16px;
        background: linear-gradient(180deg, #fffafc 0%, #ffffff 100%);
    }

    .reset-done-card {
        max-width: 460px;
        margin: 0 auto;
        padding: 36px 32px;
        border: 1px solid #ecd4de;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 18px 36px rgba(70, 36, 63, 0.1);
        text-align: center;
    }

    .reset-done-card h2 {
        margin: 0 0 14px;
        font-size: 2rem;
        font-weight: 700;
        color: #2f1b24;
    }

    .reset-done-card p {
        margin: 0 0 14px;
        color: #6b5a62;
        line-height: 1.6;
    }

    .reset-done-card p:last-child {
        margin-bottom: 0;
    }

    .reset-done-note {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid #f0dce4;
        font-size: 0.95rem;
    }

    @media (max-width: 520px) {
        .reset-done-card {
            padding: 28px 20px;
        }

        .reset-done-card h2 {
            font-size: 1.75rem;
        }
    }
</style>

<div class="reset-done-shell">
    <div class="reset-done-card">
        <h2>Check your inbox</h2>
        <p>Instructions for resetting your password were sent. <br>You should receive them shortly.</p>
        <p class="reset-done-note">If you don't receive an email, please check your spam folder.</p>
    </div>
</div>
{% endblock content %}
