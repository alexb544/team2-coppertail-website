{% extends "accounts/base.html" %}

{% block content %}
<style>
    .reset-shell {
        padding: 48px 16px;
        background: linear-gradient(180deg, #fffafc 0%, #ffffff 100%);
    }

    .reset-card {
        max-width: 460px;
        margin: 0 auto;
        padding: 36px 32px;
        border: 1px solid #ecd4de;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 18px 36px rgba(70, 36, 63, 0.1);
    }

    .reset-heading {
        text-align: center;
        margin-bottom: 28px;
    }

    .reset-heading h2 {
        margin: 0 0 10px;
        font-size: 2rem;
        font-weight: 700;
        color: #2f1b24;
    }

    .reset-heading p {
        margin: 0;
        color: #6b5a62;
        line-height: 1.6;
    }

    .reset-form {
        display: grid;
        gap: 18px;
    }

    .reset-form label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
        color: #432632;
    }

    .reset-form input[type="email"] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d9b1bf;
        border-radius: 10px;
        background: #fffafc;
        color: #2f1b24;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .reset-form input[type="email"]:focus {
        outline: none;
        border-color: #b85b84;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(184, 91, 132, 0.16);
    }

    .reset-note {
        text-align: center;
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid #f0dce4;
        color: #6b5a62;
        font-size: 0.95rem;
        line-height: 1.6;
    }

    @media (max-width: 520px) {
        .reset-card {
            padding: 28px 20px;
        }

        .reset-heading h2 {
            font-size: 1.75rem;
        }
    }
</style>

<div class="reset-shell">
    <div class="reset-card">
        <div class="reset-heading">
            <h2>Password Reset</h2>
            <p>Enter the email address tied to your account <br> and we’ll send you instructions to create a new password</p>
        </div>

        <form method="POST" class="reset-form">
            {% csrf_token %}
            <div>
                <label for="id_email">Email Address</label>
                <input type="email" name="email" id="id_email" class="form-control" required>
            </div>
            <button type="submit" class="coppertail-button w-full text-lg">Send Reset Email</button>
        </form>

        <div class="reset-note">
            Check your spam or junk folder if the email doesn’t appear
        </div>
    </div>
</div>
{% endblock content %}
