{% extends "accounts/base.html" %}
{% block content %}
<style>
    .reset-complete-shell {
        padding: 48px 16px;
        background: linear-gradient(180deg, #fffafc 0%, #ffffff 100%);
    }

    .reset-complete-card {
        max-width: 460px;
        margin: 0 auto;
        padding: 36px 32px;
        border: 1px solid #ecd4de;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 18px 36px rgba(70, 36, 63, 0.1);
        text-align: center;
    }

    .reset-complete-card h2 {
        margin: 0 0 12px;
        font-size: 1.8rem;
        font-weight: 700;
        color: #2f1b24;
        white-space: nowrap;
    }

    .reset-complete-card p {
        margin: 0 0 24px;
        color: #6b5a62;
        line-height: 1.6;
    }

    @media (max-width: 520px) {
        .reset-complete-card {
            padding: 28px 20px;
        }

        .reset-complete-card h2 {
            font-size: 1.5rem;
        }
    }
</style>

<div class="reset-complete-shell">
    <div class="reset-complete-card">
        <h2>Password Reset Complete</h2>
        <p>Your password has been successfully updated!</p>
        <a href="{% url 'accounts:login' %}" class="coppertail-button">Log In Here</a>
    </div>
</div>
{% endblock content %}
