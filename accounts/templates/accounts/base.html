
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{% static 'accounts/editor.css' %}" />
	<title>{% block title %}Coppertail Grooming{% endblock %}</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		.container {
            width: min(900px, calc(100% - 40px));
            margin: 20px auto;
        }
	</style>
</head>
<body>
	<header>
		<div class = "centered-title">
			<img src="{% static 'accounts/coppertail-grooming-logo.png' %}"
			alt="Coppertail Grooming Log"
			height="100"/>
			<h1>Coppertail Grooming Co.</h1>
		</div>
		<hr>
		<nav class = "navbar">
			<ul>
				<li> <a class = "header-link" id = "home" href = "http://127.0.0.1:8000/">Home</a> </li>
				<li> <a class = "header-link" id = "services" href = "http://127.0.0.1:8000/services">Services</a> </li>
				<li> <a class = "header-link" id = "appointment" href = "{% url 'booking_create' %}">Book Now</a> </li>
				<li> <a class = "header-link" id = "contact">Contact Us</a> </li>
				<li> <a class = "header-link" id = "login-link" href = "http://127.0.0.1:8000/login/">Log In</a> </li>
			</ul>
		</nav>
	</header>

	<div class = "container">
		{% if messages %}
            {% for message in messages %}
                <div style="
					padding: 20px; 
					background-color: #fcf8e3; 
					border: 1px solid #faebcc; 
					color: #8a6d3b; 
					margin-bottom: 20px; 
					border-radius: 5px; 
					text-align: center;
					">{{ message }}
                </div>
            {% endfor %}
        {% endif %}
		{% block content %}
		{% endblock %}
	</div>

	<footer></footer>
</body>
</html>
