
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{% static 'accounts/editor.css' %}" />
	<title>{% block title %}Coppertail Grooming{% endblock %}</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		</style>
</head>
<body>
	<header>
		<div class = "centered-title">
			<img src="{% static 'accounts/coppertail-grooming-logo.jpg' %}"
			alt="Coppertail Grooming Logo"
			height="100"/>
			<h1>Copper Tail Grooming Co.</h1>
		</div>
		<hr>
		<nav class = "navbar">
			<ul>
				<li> <a class="header-link" id="home" href="{% url 'accounts:accounts' %}">Home</a> </li>
    <li> <a class="header-link" id="services">Services</a> </li>
    <li> <a class="header-link" id="appointment">Book Now</a> </li>
    <li> <a class="header-link" id="contact">Contact Us</a> </li>
    <li> <a class="header-link" id="login-link" href="{% url 'accounts:login' %}">Log In</a> </li>
    <li> <a class="header-link" id="register-link" href="{% url 'accounts:register' %}">Sign Up</a> </li>
			</ul>
		</nav>
	</header>

	<div class = "container">
		{% if messages %}
            {% for message in messages %}
                <div style="padding: 20px; background-color: #fcf8e3; border: 1px solid #faebcc; color: #8a6d3b; margin-bottom: 20px; border-radius: 5px; text-align: center;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
		{% block content %}
		{% endblock %}
	</div>

	<footer></footer>
</body>
</html>
